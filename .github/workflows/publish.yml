# source template:
# https://github.com/Homebrew/brew/blob/main/.github/workflows/tap-new-publish.yml
name: brew pr-pull

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [labeled]

permissions: {}
jobs:
  pr-pull:
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      # tap-new-github-packages-start
      packages: write
      # tap-new-github-packages-end
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193 # 2026.08.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@5037c6f1012cc5ea0b9f03fedbaf9955ed9e51e0 # 2026.08.03.1

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tap-new-github-packages-start
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          # tap-new-github-packages-end
          # HEAD_SHA: ${{ inputs.head_sha }}
          # PULL_REQUEST: ${{ inputs.pull_request }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" "$PULL_REQUEST"
          else
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Push commits
        uses: Homebrew/actions/git-try-push@5037c6f1012cc5ea0b9f03fedbaf9955ed9e51e0 # 2026.08.03.1
        with:
          branch: ${{ github.event.pull_request.head.ref }}
